# Render blueprint for the Tend Phase-B backend (Lloyds + Chase + Trading 212).
# In Render: New → Blueprint → point at this repo & the `main` branch.
# Then set the secret env vars (marked sync:false) in the dashboard.
#
# NB: this backend does NOT run on Vercel — Vercel only serves the static site.
# The `backend/` folder is listed in .vercelignore so Vercel never builds it.
services:
  - type: web
    name: tend-backend
    runtime: python
    plan: free
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_APPLICATION_ID
        sync: false
      - key: ENABLE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_URL
        value: https://claude-test1-tend.vercel.app
      - key: BACKEND_URL
        sync: false   # set to your Render URL once known, e.g. https://tend-backend.onrender.com
      - key: ACCESS_VALID_DAYS
        value: "90"
      - key: T212_MODE
        value: "live"
