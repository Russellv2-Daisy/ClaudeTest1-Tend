<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tend" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Tend — your tasks, tended</title>
  <style>
    /* Light is the default. Dark applies either via an explicit data-mode="dark"
       override (set by the app), or via the OS setting when the user hasn't
       forced a mode (data-mode absent / not light|dark). data-mode="light"
       therefore wins over the OS preference. */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f7;
      --color-background-tertiary: #ececf0;
      --color-text-primary: #1c1c1e;
      --color-text-secondary: #6b6b70;
      --color-border-secondary: #c7c7cc;
      --color-border-tertiary: #e3e3e6;
    }
    :root[data-mode="dark"] {
      --color-background-primary: #1c1c1e;
      --color-background-secondary: #2c2c2e;
      --color-background-tertiary: #000000;
      --color-text-primary: #f2f2f7;
      --color-text-secondary: #98989f;
      --color-border-secondary: #48484a;
      --color-border-tertiary: #38383a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-mode="light"]):not([data-mode="dark"]) {
        --color-background-primary: #1c1c1e;
        --color-background-secondary: #2c2c2e;
        --color-background-tertiary: #000000;
        --color-text-primary: #f2f2f7;
        --color-text-secondary: #98989f;
        --color-border-secondary: #48484a;
        --color-border-tertiary: #38383a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--color-background-tertiary);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    #root { min-height: 100vh; }
    input, textarea, select, button { font-family: inherit; color: var(--color-text-primary); }
    input, textarea, select {
      background: var(--color-background-secondary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--color-border-secondary); }
    button {
      background: var(--color-background-secondary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: 8px;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .boot-msg { padding: 40px; text-align: center; color: var(--color-text-secondary); font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"><div class="boot-msg">Loading Tend…</div></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <!-- Supabase (accounts + cloud sync). Loaded from CDN. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script type="text/babel" src="app.jsx" data-presets="react"></script>
</body>
</html>
