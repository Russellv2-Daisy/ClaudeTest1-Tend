# One-click deploy config for Render (https://render.com).
# Hosts the full app INCLUDING the AI backend, with your Anthropic key kept secret.
#
# How to use:
#   1. Push this folder to a GitHub repo.
#   2. On render.com: New + → Blueprint → pick the repo. Render reads this file.
#   3. When prompted, paste your Anthropic API key into the ANTHROPIC_API_KEY field.
#   4. Deploy. You'll get a free https://your-app.onrender.com URL.
services:
  - type: web
    name: tend
    runtime: python
    plan: free
    # No dependencies to install — server.py uses only the Python standard library.
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # you set this securely in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.9"
